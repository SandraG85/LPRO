<!DOCTYPE html>
<html>
<head>
    <title>Proyecto LPRO</title>
    <!-- Leaflet CSS -->
    //unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }
        .container { padding: 40px 20px; }
        h1 { font-size: 3em; margin-bottom: 20px; }
        #map {
            width: 80%;
            height: 500px;
            margin: 30px auto;
            border-radius: 15px;
        }
        footer { margin-top: 40px; font-size: 0.9em; opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <h1>El mejor proyecto de LPRO</h1>
    <div id="map"></div>
</div>

<footer>Proyecto LPRO - 2026</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Inicializa el mapa centrado en España
    const map = L.map('map').setView([40.0, -3.5], 5);

    // Capa base (OpenStreetMap, gratuito)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Consulta los eventos y pinta los puntos
    function cargarEventos() {
        fetch('/api/events')
            .then(res => res.json())
            .then(events => {
                events.forEach(ev => {
                    if (ev.lat !== undefined && ev.lon !== undefined) {
                        L.marker([ev.lat, ev.lon])
                            .addTo(map)
                            .bindPopup(`<b>${ev.nombre || 'Evento'}</b><br>Lat: ${ev.lat}<br>Lon: ${ev.lon}`);
                    }
                });
            });
    }

    cargarEventos();

    // Refresca el mapa cada 5 segundos
    setInterval(cargarEventos, 5000);
</script>

</body>
</html>
