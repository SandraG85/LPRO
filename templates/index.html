<!DOCTYPE html>
<html>
<head>
    <title>Proyecto LPRO</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #041026
; 
            color: white;
            text-align: center;
        }
        .logo-container {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
        }
        
        .logo-container img {
            height: 250px; /* ajusta el tamaño del logo*/
            
        }

        .container {
            padding: 40px 20px;
            margin-top: 220px;   /* desplaza título + mapa hacia abajo */
        }

        h1 {
            font-size: 5em;
            margin-bottom: 30px;
        }

        #map {
            width: 80%;
            height: 500px;
            margin: 30px auto;
            border-radius: 15px;
        }

        footer {
            margin-top: 40px;
            font-size: 0.9em;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="logo-container">
    <img src="static/logo_waveBlaster.png" alt="WaveBlaster logo">
</div>
    
<div class="container">
    <h1>WaveBlaster</h1>
    <div id="map"></div>
</div>

<footer>Proyecto LPRO - 2026</footer>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([40.0, -3.5], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let markers = [];

    function cargarEventos() {
        fetch('/api/events')
            .then(res => res.json())
            .then(events => {
                // Borra markers anteriores para evitar duplicados
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                events.forEach(ev => {
                    if (ev.lat !== undefined && ev.lon !== undefined) {
                        const marker = L.marker([ev.lat, ev.lon])
                            .addTo(map)
                            .bindPopup(
                                '<b>' + (ev.nombre || 'Evento') + '</b><br>' +
                                'Lat: ' + ev.lat + '<br>' +
                                'Lon: ' + ev.lon
                            );
                        markers.push(marker);
                    }
                });
            });
    }

    cargarEventos();
    setInterval(cargarEventos, 5000);

    
</script>

</body>
</html>
